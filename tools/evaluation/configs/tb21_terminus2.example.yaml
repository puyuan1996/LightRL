# Terminal-Bench 风格数据集 + Harbor terminus-2 完整示例。
# 所有路径均为占位符,使用前请替换;${VAR} 会做环境变量展开。
harness: terminus-2
job_name: my-model-tb-eval
output_dir: ${EVAL_OUTPUT_DIR:-/path/to/eval-runs}/my-model-tb-eval  # Harbor jobs_dir

dataset:
  path: /path/to/terminal-bench/tasks   # Harbor dataset 目录(含 task 子目录)
  task_names: null                       # 指定 ["<task-name>"] 可只跑单题(smoke 子命令更省事)

run:
  n_attempts: 1
  concurrency: 16          # Harbor n_concurrent_trials
  max_retries: 1
  timeout_multiplier: 1.0
  max_input_tokens: 32768
  max_output_tokens: 8192

serving:
  mode: managed            # managed: 工具层自动起停本地 SGLang;external: 已存在的 OpenAI 兼容端点
  model_path: /path/to/hf-checkpoint
  model_name: my-model
  port: 30000
  gpu_ids: [0, 1, 2, 3]
  tp_size: 4
  mem_fraction: 0.70
  health_timeout_s: 900
  # api_base 不填时默认推导为本机端口;显式给出则直接使用(external 模式必填)
  api_base: http://127.0.0.1:30000/v1
  # command_template: 自定义 SGLang 启动命令模板,占位符 {model_path}/{served_name}/{port}/{tp_size}/{gpu_ids}/{mem_fraction}
  # launcher: nohup        # nohup | tmux
  # tmux_session: eval-sglang

# 透传到任务容器(docker environment.env)的环境变量
environment:
  TZ: Etc/UTC
  DEBIAN_FRONTEND: noninteractive
  UV_LINK_MODE: copy
  UV_INDEX_URL: https://pypi.org/simple
  # 需要代理的站点在这里加 HTTP_PROXY/HTTPS_PROXY 等;见 site/ 下的站点 profile 示例

extra:
  harbor_bin: harbor       # harbor CLI 路径(可用虚拟环境里的绝对路径)
  # mounts:                # docker bind 挂载,原样进入 Harbor config 的 mounts_json
  #   - {type: bind, source: /path/to/tools, target: /opt/tools, read_only: true, bind: {create_host_path: false}}
  # extra_docker_compose:  # docker-compose 覆盖文件(如站点网络覆盖)
  #   - /path/to/network-override.yaml
  # openai_api_key: dummy
  # no_proxy: localhost,127.0.0.1,::1
  # process_env: {}        # 追加给 harbor 进程自身的环境变量
