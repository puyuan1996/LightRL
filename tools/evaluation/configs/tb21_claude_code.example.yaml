# Harbor 内置 claude-code agent 示例。
# 注意:claude-code agent 的 kwargs/env 参数面随 Harbor 版本变化,
# agent_kwargs / agent_env 请按实际使用的 Harbor 版本核对后再跑。
harness: claude-code
job_name: my-model-claude-eval
output_dir: ${EVAL_OUTPUT_DIR:-./runs/evaluation}/my-model-claude-eval

dataset:
  path: /path/to/terminal-bench/tasks
  task_names: null

run:
  n_attempts: 1
  concurrency: 8
  max_retries: 1
  timeout_multiplier: 1.0
  max_input_tokens: 32768
  max_output_tokens: 8192

serving:
  mode: external           # claude-code 走 Anthropic 协议;api_base 指向 Anthropic 兼容端点/网关
  model_name: my-model
  api_base: http://127.0.0.1:4000    # 例如本仓库 harnesses/claude_code/qwen_gateway.py 起的转换网关

environment:
  TZ: Etc/UTC

extra:
  harbor_bin: harbor
  # model_prefix: ""       # 默认不加 openai/ 前缀
  # anthropic_auth_token: dummy
  agent_kwargs: {}         # 原样透传给 Harbor claude-code agent 的 kwargs
  agent_env: {}            # 原样透传进 agent env,会覆盖 ANTHROPIC_BASE_URL/ANTHROPIC_AUTH_TOKEN 默认值
