# camel-agent / slime eval_only 链路示例。
# 注意:slime 会自行拉起训练/推理引擎,是重量级运行时;通常需要配合集群
# 启动脚本(GPU 分配、容器、环境变量),本工具层只负责拼参、启动与结果回收。
harness: camel-agent
job_name: my-model-seta-eval
output_dir: ${EVAL_OUTPUT_DIR:-./runs/evaluation}/my-model-seta-eval   # 归一化 eval_result.json 写在这里

dataset:
  path: /path/to/prompt-data.jsonl    # slime --prompt-data

run:
  n_attempts: 1

serving:
  mode: external           # slime 自行管理引擎,serving 段对 camel-agent 不生效
  model_name: my-model

extra:
  slime_root: /path/to/slime-repo                 # slime 仓库根(内含 slime/eval_only.py)
  run_dir: /path/to/slime-run-dir                 # 结果在 <run_dir>/evaluations/<dataset>/step_*/
  hf_checkpoint: /path/to/hf-checkpoint           # --hf-checkpoint
  load: /path/to/torch-dist-checkpoint            # --load
  rollout_config: /path/to/rollout_config.yaml    # --custom-config-path
  slime_args:                # 追加/覆盖的 slime CLI 参数(键即 flag 名)
    rollout-batch-size: 64
    # num-rollout 已固定为 0(纯评测);自定义 generate/eval-log 函数路径有默认值,可在此覆盖
  process_env: {}            # 追加给 slime 进程的环境变量
