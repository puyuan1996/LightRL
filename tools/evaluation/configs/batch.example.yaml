# 多 ckpt 串行批量评测示例。
# 流程:逐 model 合并配置 → managed serving 切模型(stop+start+wait_ready)
# → 跑单模型 runner → 失败记录后继续 → 全部完成后汇总报告。
defaults:
  harness: terminus-2
  job_name: batch-eval
  output_dir: ${EVAL_OUTPUT_DIR:-/path/to/eval-runs}/batch   # 每个 model 落在其 <name>/ 子目录
  dataset:
    path: /path/to/terminal-bench/tasks
  run:
    n_attempts: 1
    concurrency: 16
    max_retries: 1
    timeout_multiplier: 1.0
    max_input_tokens: 32768
    max_output_tokens: 8192
  environment:
    TZ: Etc/UTC
    UV_INDEX_URL: https://pypi.org/simple
  extra:
    harbor_bin: harbor

# 共享的 managed serving 配置;每个 model 只换 model_path/model_name
serving:
  mode: managed
  port: 30000
  gpu_ids: [0, 1, 2, 3]
  tp_size: 4
  mem_fraction: 0.70
  health_timeout_s: 900
  api_base: http://127.0.0.1:30000/v1

models:
  - name: ckpt-a
    model_path: /path/to/ckpt-a
    model_name: ckpt-a
    # overrides:            # 可选,deep-merge 覆盖 defaults
    #   run: {concurrency: 8}
  - name: ckpt-b
    model_path: /path/to/ckpt-b
    model_name: ckpt-b

report:
  output: ${EVAL_OUTPUT_DIR:-/path/to/eval-runs}/batch/compare   # 产出 compare.md / compare.csv
