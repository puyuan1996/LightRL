# 站点 profile 示例:远端 GPU 节点 + relay + 代理 + docker 网络覆盖。
# 演示三件事(其余与通用配置一致):
#   1. extra_docker_compose 覆盖 Harbor 任务容器的网络(站点 docker 外部网络);
#   2. 代理 env(任务容器内拉包/联网都要走代理);
#   3. external serving:api_base 指向 relay 暴露的模型端点,本机不起 SGLang。
harness: terminus-2
job_name: site-profile-eval
output_dir: ${EVAL_OUTPUT_DIR:-./runs/evaluation}/site-profile-eval

dataset:
  path: /path/to/site/datasets/terminal-bench/tasks
  task_names: null

run:
  n_attempts: 1
  concurrency: 4
  max_retries: 1
  timeout_multiplier: 1.0
  max_input_tokens: 8192
  max_output_tokens: 8192

serving:
  mode: external
  # relay 把远端 SGLang 暴露为本机端点;模型名按 relay 注册名填写
  model_name: my-served-model
  api_base: http://127.0.0.1:31000/v1

environment:
  TZ: Etc/UTC
  DEBIAN_FRONTEND: noninteractive
  APT_CONFIG: /opt/site-apt/apt.conf
  HTTP_PROXY: http://<proxy-host>:<proxy-port>
  HTTPS_PROXY: http://<proxy-host>:<proxy-port>
  http_proxy: http://<proxy-host>:<proxy-port>
  https_proxy: http://<proxy-host>:<proxy-port>
  NO_PROXY: localhost,127.0.0.1,::1
  no_proxy: localhost,127.0.0.1,::1
  UV_LINK_MODE: copy
  UV_INDEX_URL: https://pypi.org/simple
  UV_CACHE_DIR: /tmp/site-uv-cache

extra:
  harbor_bin: /path/to/site/venv/bin/harbor
  # 站点 docker 外部网络覆盖:让 Harbor 任务容器挂到预先创建的外部网络
  extra_docker_compose:
    - /path/to/site/network-override.yaml
  # 站点预置的只读运行时(工具链、apt 配置、离线 wheelhouse)
  mounts:
    - {type: bind, source: /path/to/site/tools, target: /opt/site-tools, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: /path/to/site/apt, target: /opt/site-apt, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: /path/to/site/wheelhouse, target: /opt/site-wheelhouse, read_only: true, bind: {create_host_path: false}}
  no_proxy: localhost,127.0.0.1,::1
  # process_env:           # harbor 进程自身需要的环境(如 DOCKER_CONFIG)
  #   DOCKER_CONFIG: /path/to/site/docker-cli
