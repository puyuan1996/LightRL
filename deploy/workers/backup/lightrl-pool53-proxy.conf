[Service]
# Never load the credential-bearing upstream proxy environment into the worker.
# The dedicated tinyproxy service reads that root-only file; the worker and all
# Compose containers receive only the credential-free bridge URL from
# lightrl-pool53-runtime-proxy.conf.
# Legacy SETA compose files require unset T_BENCH_* substitutions even during
# `compose down`.  Skip that lossy/slow path; the worker's exact container,
# network, and volume cleanup runs immediately afterwards and is bounded.
Environment=TERMINAL_ENV_COMPOSE_DOWN_CLEANUP=0
# Stay below the worker's 105s close-task bound while allowing the serialized
# Docker network lock to drain a four-way reset/close burst.
Environment=TERMINAL_ENV_FORCE_DOCKER_CLEANUP_TIMEOUT=90
# One fixed48 evaluation can schedule several generations for the same task;
# keep the per-task ceiling above the client-side global live cap. The worker
# total remains 12 because node53's Docker address pools are the hard bound;
# clients retry admission while retiring cleanup leases drain.
Environment=WORKER_MAX_RUNS_PER_TASK=16
Environment=WORKER_MAX_TOTAL_RUNS=12
# First-use SETA image builds can take several minutes. Other samples for the
# same task wait on the deduplication lock; align that finite wait with the
# 20-minute reset budget instead of rejecting valid builds after 90 seconds.
Environment=WORKER_DOCKER_BUILD_QUEUE_TIMEOUT=1200
