eval:
  defaults:
    input_key: task
    metadata_key: metadata
    tool_key: tools
    top_p: 1.0
    top_k: -1
    # Keep half of the 16k model context available for the task prompt/history.
    max_response_len: 8192
  datasets:
    - name: seta_fixed48_exploit
      path: ${oc.env:REPO_ROOT}/benchmarks/datasets/seta_env_convert/eval_fixed48_v2.jsonl
      n_samples_per_eval_prompt: 1
      temperature: 0.0
    - name: seta_fixed48_explore
      path: ${oc.env:REPO_ROOT}/benchmarks/datasets/seta_env_convert/eval_fixed48_v2.jsonl
      n_samples_per_eval_prompt: 8
      temperature: 1.0
