# Reference configuration for the shell entrypoints. Values may be exported as
# environment variables; paths are intentionally site-specific.
data_root: ${MATH_DATA_ROOT:-data/math_rlvr}
datasets:
  - aime-2025
  - aime-2024
  - amc23
  - math-500
training:
  dataset: ${TRAIN_DATASET:-aime-2025}
  reward_type: ${REWARD_TYPE:-math}
  # DAPO: 20,480 generation tokens (16,384 expected + 4,096 soft buffer).
  response_cap: ${RESPONSE_CAP:-20480}
  rollout_batch_size: ${ROLLOUT_BATCH_SIZE:-512}
  n_samples: ${N_SAMPLES:-16}
  global_batch_size: ${GLOBAL_BATCH_SIZE:-512}
  learning_rate: ${LR:-1e-6}
  lr_warmup_rollouts: ${LR_WARMUP_ITERS:-20}
  optimizer: adam
  decoupled_weight_decay: true
  eps_clip_low: 0.2
  eps_clip_high: 0.28
  overlong_expected_len: 16384
  overlong_buffer_len: 4096
  eval_interval: ${EVAL_INTERVAL:-20}
  in_training_eval: ${EVAL_DATASETS:-aime-2025,aime-2024}
evaluation:
  # Low-cost initial evaluation requested by the experiment owner.
  n: ${N:-1}
  temperature: ${TEMPERATURE:-1.0}
  top_p: ${TOP_P:-0.7}
  max_tokens: ${MAX_TOKENS:-20480}
  pass_k: 1
  trajectory_scope: eval
