harness:
  name: camel_agent
  max_turns: 10
  timeout_sec: 900

model:
  name: qwen3_8b
  checkpoint: ""
  tokenizer: ""

algorithm:
  name: dive_po
  base:
    name: dapo
    clip_ratio: 0.2
    dynamic_sampling: false
  dive_po:
    enabled: true
    centered_gate: true
    quality_blend: 1.0
    reward_processor: agentic_rl.algorithms.dive_po.centered_reward_postprocess.post_process_rewards
  lwm:
    enabled: false
    encoder: hash
    use_dapo_replay_buffer: false
    loss_coef: 0.0

environment:
  name: seta
  dataset: agentic_rl/dataset/seta_env_convert/train.jsonl
  max_turn: 10

backend:
  name: slime
  train_entrypoint: slime/train_async.py

cluster:
  name: local
  num_gpus: 8

runtime:
  launcher: ""
  env: {}
