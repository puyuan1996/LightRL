defaults:
  - harness: camel_agent
  - model: qwen3_8b
  - algorithm: dapo
  - environment: mixed
  - backend: slime
  - cluster: example

experiment:
  name: qwen3_8b_mixed_dapo

runtime:
  launcher: agentic_rl/backends/slime/runtime/train.sh
  env:
    CUSTOM_CONFIG_PATH: configs/rollout/rollout_qwen3_think.yaml
    DAPO_DYNAMIC_SAMPLING: false
    MIX_SETA_RATIO: 6
    MIX_SAFETY_RATIO: 2
    MIX_AGENTHARM_RATIO: 2
    EXPLORATION_PROFILE: "off"
