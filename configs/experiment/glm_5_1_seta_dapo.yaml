defaults:
  - harness: camel_agent
  - model: glm_5_1
  - algorithm: dapo
  - environment: seta
  - backend: slime
  - cluster: example

experiment:
  name: glm_5_1_seta_dapo

runtime:
  launcher: agentic_rl/backends/slime/runtime/train.sh
  env:
    CUSTOM_CONFIG_PATH: configs/rollout/rollout_glm51_think.yaml
    MODEL_TAG: glm-5.1
    DAPO_DYNAMIC_SAMPLING: false
    EXPLORATION_PROFILE: "off"
