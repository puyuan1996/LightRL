<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" width="1040" height="390">

<style>
  text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
  .title { font-size: 18px; font-weight: 700; }
  .gtitle { font-size: 14px; font-weight: 700; }
  .bt { font-size: 13px; font-weight: 600; }
  .bt2 { font-size: 12px; font-weight: 600; }
  .sub { font-size: 11px; fill: #57606a; }
  .bg { fill: #ffffff; }
  .ib { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
  .ibd { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .gData { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.4; }
  .gEnc  { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.4; }
  .gLat  { fill: #fbefff; stroke: #a371f7; stroke-width: 1.4; }
  .gPred { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.4; }
  .gLoss { fill: #fff8e6; stroke: #d4a72c; stroke-width: 1.4; }
  .a  { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
  .ad { stroke: #8c959f; stroke-width: 1.6; stroke-dasharray: 6 4; fill: none; marker-end: url(#ah); }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .sub { fill: #8d96a0; }
    .bg { fill: #0d1117; }
    .ib { fill: #161b22; stroke: #30363d; }
    .ibd { fill: #161b22; stroke: #6e7681; }
    .gData { fill: rgba(110,118,129,0.12); stroke: #6e7681; }
    .gEnc  { fill: rgba(56,139,253,0.13); stroke: #388bfd; }
    .gLat  { fill: rgba(163,113,247,0.13); stroke: #a371f7; }
    .gPred { fill: rgba(63,185,80,0.13); stroke: #3fb950; }
    .gLoss { fill: rgba(210,153,34,0.13); stroke: #d29922; }
    .a { stroke: #8d96a0; }
    .ad { stroke: #6e7681; }
  }
</style>
<defs>
  <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#6e7681"/>
  </marker>
</defs>

<rect class="bg" width="1040" height="390"/>
<text x="40" y="42" class="title" text-anchor="start">图 2｜单次 causal forward 的 hidden 提取边界（§3.2）</text>
<rect x="60" y="100" width="560" height="64" rx="8" class="gEnc"/>
<rect x="620" y="100" width="320" height="64" rx="8" class="gPred"/>
<rect x="60" y="100" width="880" height="64" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.4"/>
<text x="340" y="138" class="bt" text-anchor="middle">prompt tokens（h<tspan dy="3" font-size="9">t</tspan><tspan dy="-3">​</tspan>）</text>
<text x="780" y="138" class="bt" text-anchor="middle">action tokens（a<tspan dy="3" font-size="9">t</tspan><tspan dy="-3">​</tspan>）</text>
<line x1="612" y1="92" x2="612" y2="168" stroke="#d4a72c" stroke-width="2.4"/>
<text x="612" y="84" class="bt2" text-anchor="middle">prompt_end</text>
<path d="M660,176 V184 H900 V176" fill="none" stroke="#d4a72c" stroke-width="2.4"/>
<text x="780" y="204" class="bt2" text-anchor="middle">action_span</text>
<rect x="140" y="240" width="360" height="76" rx="8" class="ib"/>
<text x="320" y="268" class="bt" text-anchor="middle">state hidden = hidden[prompt_end]</text>
<text x="320" y="290" class="sub" text-anchor="middle">causal mask 使其看不到 action</text>
<text x="320" y="306" class="sub" text-anchor="middle">⇒ 纯状态表征</text>
<path d="M612,168 V216 H320 V236" class="a"/>
<rect x="580" y="240" width="380" height="76" rx="8" class="ib"/>
<text x="770" y="268" class="bt" text-anchor="middle">action hidden = pool(hidden[action_span])</text>
<text x="770" y="290" class="sub" text-anchor="middle">mean / last pooling</text>
<text x="770" y="306" class="sub" text-anchor="middle">可见 state 与已生成的 action</text>
<path d="M780,184 V236" class="a"/>
<text x="40" y="360" class="sub" text-anchor="start">注：feedback o<tspan dy="3" font-size="9">t+1</tspan><tspan dy="-3">​</tspan> 与 next-state h<tspan dy="3" font-size="9">t+1</tspan><tspan dy="-3">​</tspan> 由无梯度 target forward 另行编码（图 1 虚线分支）；hidden_layer 可配置，默认 -1。</text>
</svg>