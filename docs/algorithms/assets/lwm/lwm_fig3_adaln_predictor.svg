<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500">

<style>
  text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
  .title { font-size: 18px; font-weight: 700; }
  .gtitle { font-size: 14px; font-weight: 700; }
  .bt { font-size: 13px; font-weight: 600; }
  .bt2 { font-size: 12px; font-weight: 600; }
  .sub { font-size: 11px; fill: #57606a; }
  .bg { fill: #ffffff; }
  .ib { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
  .ibd { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .gData { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.4; }
  .gEnc  { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.4; }
  .gLat  { fill: #fbefff; stroke: #a371f7; stroke-width: 1.4; }
  .gPred { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.4; }
  .gLoss { fill: #fff8e6; stroke: #d4a72c; stroke-width: 1.4; }
  .a  { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
  .ad { stroke: #8c959f; stroke-width: 1.6; stroke-dasharray: 6 4; fill: none; marker-end: url(#ah); }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .sub { fill: #8d96a0; }
    .bg { fill: #0d1117; }
    .ib { fill: #161b22; stroke: #30363d; }
    .ibd { fill: #161b22; stroke: #6e7681; }
    .gData { fill: rgba(110,118,129,0.12); stroke: #6e7681; }
    .gEnc  { fill: rgba(56,139,253,0.13); stroke: #388bfd; }
    .gLat  { fill: rgba(163,113,247,0.13); stroke: #a371f7; }
    .gPred { fill: rgba(63,185,80,0.13); stroke: #3fb950; }
    .gLoss { fill: rgba(210,153,34,0.13); stroke: #d29922; }
    .a { stroke: #8d96a0; }
    .ad { stroke: #6e7681; }
  }
</style>
<defs>
  <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#6e7681"/>
  </marker>
</defs>

<rect class="bg" width="1040" height="500"/>
<text x="40" y="42" class="title" text-anchor="start">图 3｜AdaLN predictor：action 只生成每层的调制参数（§3.3）</text>
<rect x="60" y="120" width="170" height="130" rx="8" class="gLat"/>
<text x="145" y="158" class="bt" text-anchor="middle">z<tspan dy="-5" font-size="9">s</tspan><tspan dy="8" font-size="9">t</tspan><tspan dy="-3">​</tspan></text>
<text x="145" y="180" class="bt2" text-anchor="middle">state tokens</text>
<text x="145" y="202" class="sub" text-anchor="middle">（Q/K/V 来源）</text>
<path d="M230,185 H296" class="a"/>
<rect x="300" y="70" width="320" height="110" rx="10" class="gPred"/>
<text x="460" y="102" class="bt" text-anchor="middle">Transformer block 1</text>
<text x="460" y="124" class="sub" text-anchor="middle">Self-Attention Q/K/V + FFN</text>
<text x="330" y="162" class="sub" text-anchor="start">← shift / scale / gate</text>
<rect x="300" y="250" width="320" height="110" rx="10" class="gPred"/>
<text x="460" y="282" class="bt" text-anchor="middle">Transformer block N</text>
<text x="460" y="304" class="sub" text-anchor="middle">Self-Attention Q/K/V + FFN</text>
<text x="330" y="342" class="sub" text-anchor="start">← shift / scale / gate</text>
<path d="M460,180 V196" class="a"/>
<circle cx="478" cy="206" r="2.2" fill="#57606a"/><circle cx="478" cy="216" r="2.2" fill="#57606a"/><circle cx="478" cy="226" r="2.2" fill="#57606a"/>
<path d="M460,224 V246" class="a"/>
<rect x="700" y="270" width="270" height="70" rx="8" class="ib"/>
<text x="835" y="298" class="bt2" text-anchor="middle">predicted feedback latent</text>
<text x="835" y="320" class="sub" text-anchor="middle">ẑ<tspan dy="-5" font-size="9">o</tspan><tspan dy="8" font-size="9">t+1</tspan><tspan dy="-3">​</tspan></text>
<path d="M620,305 H696" class="a"/>
<rect x="60" y="420" width="200" height="48" rx="8" class="gLat"/>
<text x="160" y="449" class="bt2" text-anchor="middle">e<tspan dy="-5" font-size="9">a</tspan><tspan dy="8" font-size="9">t</tspan><tspan dy="-3">​</tspan>  action 条件</text>
<path d="M260,444 H296" class="a"/>
<rect x="300" y="420" width="220" height="48" rx="8" class="ib"/>
<text x="410" y="449" class="bt2" text-anchor="middle">SiLU + Linear（每层独立）</text>
<path d="M400,420 V364" class="a"/>
<path d="M300,432 H268 V170 H296" class="a"/>
<text x="260" y="300" class="sub" text-anchor="middle" transform="rotate(-90 260 300)">shift / scale / gate（每层）</text>
<text x="650" y="424" class="sub" text-anchor="start">action 不作为 token 进入 attention，也不与 state 特征拼接——</text>
<text x="650" y="442" class="sub" text-anchor="start">AdaLN 门控使其不可被绕过，且同一 state 可并行评分整批候选 action。</text>
</svg>